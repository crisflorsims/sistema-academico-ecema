services:
  - type: web
    name: sistema-academico-ecema
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && cd backend && npm install && npx prisma generate
    startCommand: cd backend && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
